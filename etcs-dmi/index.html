<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETCS DMI Symbol Catalogue — ERA_ERTMS_015560 v4.0.0</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app">
  <a href="../index.html" class="back-to-tools" style="display:inline-block;margin:0 0 6px;font-size:12px;color:var(--dmi-medgrey);text-decoration:none;" title="Back to Tools">&larr; Tools</a>
  <h1>ETCS DMI Symbol Catalogue<span class="v">ERA_ERTMS_015560 v4.0.0</span>
    <span class="lang-switch">
      <button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="cs">CZ</button>
    </span>
  </h1>
  <p class="sub" id="sub"></p>
  <div class="toolbar">
    <input id="search" type="search" autocomplete="off">
    <select id="colorSel" title="Filter by symbol colour"></select>
    <button id="quizBtn" class="quiz-launch"></button>
    <button id="mapBtn" class="quiz-launch"></button>
    <span id="count"></span>
  </div>
  <div id="catChips" class="chips"></div>
</header>

<main>
  <div id="grid"></div>

  <section id="soundsSection">
    <h2 id="soundsTitle"></h2>
    <p id="soundsDesc"></p>
    <div id="sounds"></div>
  </section>

  <section id="msgsSection">
    <h2 id="msgsTitle"></h2>
    <p id="msgsDesc"></p>
    <div class="msg-toolbar">
      <input id="msgSearch" type="search" autocomplete="off">
      <span id="msgCount"></span>
    </div>
    <div id="msgList"></div>
  </section>
</main>

<dialog id="detail">
  <div class="detail-wrap">
    <button id="detailClose" aria-label="Close">✕ close</button>
    <div id="detailBody"></div>
  </div>
</dialog>

<dialog id="areamap">
  <div class="map-dlg-wrap">
    <button id="mapClose" aria-label="Close">✕</button>
    <h2 id="mapTitle"></h2>
    <p id="mapHint" class="map-hint"></p>
    <div id="areaMapHolder"></div>
    <div id="areaOther" class="area-other"></div>
    <div id="areaResult"></div>
  </div>
</dialog>

<dialog id="quiz">
  <div class="quiz-wrap">
    <button id="quizClose" aria-label="Close">✕</button>
    <div id="quizBody"></div>
  </div>
</dialog>

<footer id="footer"></footer>

<script src="js/data.js"></script>
<script src="js/i18n_cs.js"></script>
<script src="js/app.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
