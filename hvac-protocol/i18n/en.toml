# CABIN - MEASUREMENTS
# =============================================================================

[cabin.compressor_heater_current]
label   = "Compressor heater current"
summary = "Baseline current of the cabin compressor sump heater (subtracted from later raw readings)."
tools_needed = ["Clamp meter (single phase)"]
procedure = [
    "Clamp the meter around input cable L2.",
    "Wait for the reading to settle, then record.",
]

[cabin.compressor_temp_start]
label   = "Compressor temp at start"
summary = "Initial cabin compressor body temperature before the test run."
tools_needed = ["Non-contact (infrared) thermometer"]
procedure = [
    "Aim the IR thermometer at the compressor body.",
    "Record the reading.",
]

[cabin.evap_fan_1f]
label   = "Evaporator fan 1F 100%"
summary = "Single-phase current of the cabin supply fan at 100% PWM."
tools_needed = ["Clamp meter (single phase)"]
procedure = [
    "Clamp the meter around the cable on breaker F1 (single-phase).",
    "Set CCS8 OUT1 = 1 (release supply fan).",
    "Set PWM1 = 100% at 500 Hz.",
    "Verify IN1 (supply fan ON) goes to 1.",
    "Wait for stabilisation, then read.",
]

[cabin.condenser_fan_3f_raw]
label   = "Condenser fan 3F 100% (raw)"
summary = "Three-phase (raw) current of the cabin condenser fan."
tools_needed = ["Clamp meter (single phase)"]
procedure = [
    "Move the clamp meter back to cable L2.",
    "Set CCS8 OUT2 = 1.",
    "Verify IN3 (condenser fan ON) goes to 1.",
    "Wait for stabilisation, then read.",
]

[cabin.heater_resistance_12]
label   = "Heater resistance 1-2 (F4_2 - F4_4)"
summary = "Resistance of cabin heater coil between F4_2 and F4_4."
tools_needed = ["Multimeter (Ω mode)"]
procedure = ["Measure resistance between F4_2 and F4_4."]
safety = [
    "Measure with the unit fully powered off. This is one of the last steps for that reason.",
]

[cabin.heater_resistance_23]
label   = "Heater resistance 2-3 (F4_4 - F4_6)"
summary = "Resistance of cabin heater coil between F4_4 and F4_6."
tools_needed = ["Multimeter (Ω mode)"]
procedure = ["Measure resistance between F4_4 and F4_6."]
safety = ["Power off."]

[cabin.heater_resistance_31]
label   = "Heater resistance 3-1 (F4_6 - F4_2)"
summary = "Resistance of cabin heater coil between F4_6 and F4_2."
tools_needed = ["Multimeter (Ω mode)"]
procedure = ["Measure resistance between F4_6 and F4_2."]
safety = ["Power off."]

[cabin.compressor_raw]
label   = "Compressor (raw)"
summary = "Raw current of the cabin compressor at stable operation."
tools_needed = ["Clamp meter (single phase)"]
prerequisites = [
    "Condenser fan ON, release supply fan ON.",
]
procedure = [
    "A few seconds before compressor start, set OUT5 = 1 (bypass).",
    "Set CCS8 OUT3 = 1 (compressor on).",
    "Verify IN2 (compressor ON) goes to 1.",
    "A few seconds after stable running, clear OUT5 (bypass).",
    "Verify IN5 (low pressure OK) stays 1.",
    "Wait for current to stabilise, then read.",
]

[cabin.operating_low_pressure]
label   = "Operating low pressure"
summary = "Cabin suction-side pressure under stable full-power operation."
tools_needed = ["External pressure gauge (low side)"]
prerequisites = ["At least 5 minutes of full-power runtime."]
procedure = ["Read the suction gauge."]

[cabin.operating_high_pressure]
label   = "Operating high pressure"
summary = "Cabin discharge-side pressure under stable full-power operation."
tools_needed = ["External pressure gauge (high side)"]
prerequisites = ["At least 5 minutes of full-power runtime."]
procedure = [
    "Read the discharge gauge.",
    "Cross-check against CCS8 'Current value - high pressure' (should match within a few bar).",
]

[cabin.output_temperature]
label   = "Output temperature"
summary = "Cabin duct temperature read from the controller."
prerequisites = ["At least 5 minutes of full-power runtime."]
procedure = ["Read CCS8 Temp1 (Duct temperature)."]

[cabin.compressor_temp_end]
label   = "Compressor temperature (end)"
summary = "Final cabin compressor body temperature after the full-power run."
tools_needed = ["Non-contact (infrared) thermometer"]
procedure = [
    "Aim the IR thermometer at the compressor body.",
    "Record the reading.",
]

[cabin.high_pressostat]
label   = "High pressostat"
summary = "Pressure at which the cabin high-pressure safety cuts the compressor off."
tools_needed = ["External pressure gauge (high side)"]
procedure = [
    "Set CCS8 OUT2 = 0 (condenser fan off).",
    "Watch the high-side pressure rise.",
    "Around 24 bar the compressor MUST shut off on its own.",
    "Read the pressure on the gauge at the moment of shut-off.",
    "Verify IN2 (compressor ON) goes to 0.",
    "Then: clear OUT3 and briefly set OUT5 = 1 (bypass) to equalise.",
]
expected = [
    "Compressor shuts off automatically at approximately 24 bar.",
]
safety = [
    "If the compressor does NOT shut off by ~26 bar, manually stop it immediately.",
]

[cabin.low_pressostat]
label   = "Low pressostat"
summary = "Pressure at which the cabin low-pressure safety reports the suction has dropped."
tools_needed = ["External pressure gauge (low side)"]
procedure = [
    "Set CCS8 PWM1 = 20%.",
    "Mechanically remove the solenoid from the compressor.",
    "Set OUT2 = 1 (condenser fan).",
    "Wait for the pressure to drop below approximately 0.5 bar.",
    "Verify IN5 (low pressure DC OK) goes to 0.",
    "Read the gauge, then shut everything down.",
]

