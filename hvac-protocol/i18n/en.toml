# HVAC Protocol Tool - English content
# Structure:
#   [salon.<step_id>]     content for salon checks + measurements
#   [cabin.<step_id>]     content for cabin checks + measurements
#   [salon_calc.<key>]    label for derived calculated values (salon)
#   [cabin_calc.<key>]    label for derived calculated values (cabin)
#   [ui]                  UI chrome strings
# Fields per step (all optional except label):
#   label, summary, prerequisites[], tools_needed[], procedure[],
#   expected[], troubleshooting[], safety[]
# Lists with one item are allowed.

