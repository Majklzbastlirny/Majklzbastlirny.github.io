# =============================================================================
# SALON - KONTROLY
# =============================================================================

[salon.flaps]
label   = "Klapky"
summary = "Ověřit, že klapka venkovního vzduchu reaguje na povely a koncový snímač hlásí polohu."
prerequisites = [
    "Klimatizace zapnutá.",
    "Otevřená stránka CCS16 na diagnostickém displeji.",
    "Vizuální přístup ke klapce na střeše vozu.",
]
procedure = [
    "Po zapnutí klimatizace musí v sekci CCS16 svítit digital input 8 (IN8 = 1).",
    "Sepnout CCS16 OUT8 = 1 (Flap 100% outside). Sledovat pohyb klapky vizuálně.",
    "Ověřit, že IN8 přejde na 0 jakmile klapka opustí koncovou polohu.",
    "Po dojetí klapky do venkovní polohy vypnout OUT8.",
    "Sepnout CCS16 OUT7 = 1 (Flap 100% return). Počkat na návrat klapky.",
    "Ověřit, že IN8 se vrátí na 1.",
]
expected = [
    "Klapka se viditelně pohybuje oběma směry.",
    "IN8 přepíná 1 -> 0 při opuštění polohy, 0 -> 1 při návratu.",
]
troubleshooting = [
    "Klapka se nehýbe: zkontrolovat přívod stlačeného vzduchu.",
    "IN8 nereaguje: zkontrolovat zapojení koncového snímače.",
]

[salon.valves]
label   = "Ventily"
summary = "Ověřit, že každý solenoid při sepnutí výstupu slyšitelně cvakne."
prerequisites = [
    "Klimatizace zapnutá, otevřená sekce CCS16.",
    "Dostatečné ticho, aby bylo slyšet cvaknutí každého ventilu.",
]
procedure = [
    "Sepnout CCS16 OUT10 = 1 (Main fluid line). Poslechnout cvaknutí.",
    "Sepnout CCS16 OUT11 = 1 (Evaporator). Poslechnout cvaknutí.",
    "Sepnout CCS16 OUT12 = 1 (Cylinder 1 off). Poslechnout cvaknutí.",
    "Sepnout CCS16 OUT13 = 1 (Cylinder 2 off). Na některých jednotkách signál chybí - pak přeskočit.",
    "Sepnout CCS16 OUT14 = 1 (Bypass). Poslechnout cvaknutí.",
    "Po skončení všechny výstupy vrátit do 0.",
]
expected = [
    "U každého výstupu je slyšet zřetelné cvaknutí ventilu.",
]

[salon.temp_sensors]
label   = "Teplotní čidla"
summary = "Ověřit, že všechna teplotní čidla a snímač vysokého tlaku ukazují realistické hodnoty."
prerequisites = [
    "Klimatizace zapnutá.",
    "Dosažitelné stránky CCM8 a CCS16.",
]
procedure = [
    "CCM8: musí mít 5 čidel s validní hodnotou (6 tam, kde je WC).",
    "CCS16: musí mít 4 platné teplotní hodnoty.",
    "CCS16: ověřit, že 'Current values - high pressure' ukazuje realistickou hodnotu.",
]
expected = [
    "Žádné čidlo neukazuje '--' nebo zjevně chybnou hodnotu.",
    "Hodnota vysokého tlaku odpovídá externímu manometru v rámci pár barů.",
]

[salon.exhaust_fans]
label   = "Odtahové ventilátory"
summary = "Poslechnout oba odtahové ventilátory vozu při 50% a 100% otáček."
prerequisites = [
    "Klimatizace zapnutá, otevřená sekce CCM8.",
    "Slyšitelnost odtahových ventilátorů na střeše vozu (zvenčí nebo přes potrubí).",
]
procedure = [
    "Sepnout CCM8 digital OUT6 = 1.",
    "Nastavit CCM8 PWM1 na 50% a 500 Hz. Poslechnout oba ventilátory.",
    "Zvýšit PWM1 na 100%. Opět poslechnout.",
    "Po skončení vrátit OUT6 a PWM1 do 0.",
]
expected = [
    "Oba ventilátory běží, bez drhnutí nebo nepravidelností.",
    "Otáčky se viditelně mění mezi 50% a 100%.",
]

